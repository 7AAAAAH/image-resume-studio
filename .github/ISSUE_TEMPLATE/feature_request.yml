name: 功能建议
description: 提出一个新的使用场景或改进方向
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 描述你在什么情况下遇到了什么问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的建议
      description: 你希望产品如何解决这个问题？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你目前是怎么绕过的？
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 图片导入 / OCR
        - 版式与样式
        - 一页适配
        - 导出
        - 编辑器体验
        - 文档与工程
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认提交的内容不包含真实个人信息
          required: true